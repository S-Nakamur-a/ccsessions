[package]
name = "ccsessionsd"
description = "macOS menu bar overlay that shows running Claude Code sessions as a flock of creatures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
publish.workspace = true
# core / CLI とは違い、これは常駐 GUI。
categories = ["command-line-utilities", "gui"]

[[bin]]
name = "ccsessionsd"
path = "src/main.rs"

[dependencies]
ccsessions-core = { path = "../ccsessions-core" }

# バージョンは、この組み合わせで objc2 の FFI 呼び出しが通ることを実際に確かめて
# ピンしてある。objc2 系は minor 更新でメソッド名・型が変わるため、実証済みの
# 組み合わせから動かさない。
#
# なお **この crate は macOS 専用**（AppKit / CoreAnimation を直に叩く）。依存を
# target 修飾していないので、他 OS では objc2 のコンパイルエラーで落ちる
# （[`docs/adr/0021-distribution.md`](docs/adr/0021-distribution.md) の未対応項目）。
tao = "0.35.3"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-quartz-core = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
