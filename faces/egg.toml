# たまご — 既定の顔。上が丸く下がすぼまる卵型。
#
# 元デザインの CSS:
#   border-radius: 50% 50% 48% 48% / 58% 58% 42% 42%
# 座標は 0..1 の比率・左下原点・y は上向き（faces/README.md を参照）。

id       = "egg"
label    = "たまご"
label_en = "Egg"

[size]
bar  = { w = 22, h = 20 }
dock = { w = 36, h = 34 }

[outline]
kind = "corners"
# CSS の border-radius と同じ順（左上・右上・右下・左下）で [水平比率, 垂直比率]。
corners = [[0.50, 0.58], [0.50, 0.58], [0.48, 0.42], [0.48, 0.42]]

[eyes]
shape  = "rounded"
gap    = { bar = 3.0, dock = 5.0 }
size   = { bar = [3.0, 4.0], dock = [4.0, 6.0] }
radius = 2.0
# [eyes.states.*] を書いていないので、全 6 状態が既定ルールで決まる
# （作業中は瞬き／判断待ちは正円に見開いて白く光る／エージェント待ちは横目／
#  アイドルは高さ 2pt の横線／エラーは目が赤い）。
