# ─────────────────────────────────────────────────────────────────────────────
# 顔の雛形。これをコピーして id を変えれば、そのまま動く顔になる。
#
#   mkdir -p ~/.config/ccsessions/faces
#   cp faces/_template.toml ~/.config/ccsessions/faces/mine.toml
#   $EDITOR ~/.config/ccsessions/faces/mine.toml    # ↓ の id を "mine" にする
#   ccsessions face check mine
#   ccsessions face render mine --size dock > /tmp/mine.svg
#
# 中身は組込みの egg（たまご）と同じ形で、コメントを厚くしてある。
# 詳しい説明は faces/README.md。
#
# **このファイル自体は顔として読み込まれない**（`_` で始まるファイルは雛形として飛ばす）。
# ─────────────────────────────────────────────────────────────────────────────

# 必須。英小文字・数字・ハイフンだけ、先頭は英数字、32 文字以内。
# config.toml の `design = "..."` に書く値であり、既にある顔と衝突してはいけない。
id       = "template"
# 必須。メニューに出る名前。
label    = "ひな型"
# 任意。
label_en = "Template"
# 任意。ギャラリーのクレジットに出る。
author   = "your-name"


# ── 体の寸法（pt）─────────────────────────────────────────────────────────
#
# bar = メニューバーの帯、dock = 画面下のパネル。同じ顔を 2 サイズで描く。
#
# **bar.h は 22 以下**（できれば 21 以下）。メニューバーは非ノッチ画面で 24pt しか
# なく、超えると体が縮められる。組込みの 5 種はすべて h = 20。
[size]
bar  = { w = 22, h = 20 }
dock = { w = 36, h = 34 }


# ── 輪郭 ──────────────────────────────────────────────────────────────────
#
# kind は 3 種類:
#   "corners" … 角丸長方形。下の corners か corners_pt で角の丸みを決める
#   "capsule" … 左右が半円（カプセル）。角丸は自動で h/2。追加の指定は不要
#   "path"    … 自由なシルエット。SVG の d 属性サブセットで書く（README §8）
[outline]
kind = "corners"

# CSS の border-radius と同じ順（左上・右上・右下・左下）で [水平比率, 垂直比率]。
# 比率は体の寸法に対する割合なので、bar と dock で同じ記述が効く。
#
# この値は「上が丸く、下がすぼまる」卵型。
#   上の 2 隅: 水平 50% / 垂直 58%  → 大きく丸い
#   下の 2 隅: 水平 48% / 垂直 42%  → やや詰まって、下すぼまりに見える
corners = [[0.50, 0.58], [0.50, 0.58], [0.48, 0.42], [0.48, 0.42]]

# 角丸を pt 固定にしたいとき（bar と dock で角の丸みの見た目を揃えたい場合）は
# corners の代わりにこちら。両方は書けない。
# corners_pt = { bar = 7.0, dock = 10.0 }


# ── 目 ────────────────────────────────────────────────────────────────────
[eyes]
# "rounded"（角丸矩形）か "polygon"（多角形）。
# polygon にするときは下の polygon が必須。
shape  = "rounded"

# 顔の中での縦位置。0.5 = 中央、大きいほど上。あごの長い顔は 0.58 前後で上寄せ。
v      = 0.5

# 両目の間隔（pt）。
gap    = { bar = 3.0, dock = 5.0 }

# 基準の [幅, 高さ]（pt）。状態ごとの変化はここを起点に計算される。
size   = { bar = [3.0, 4.0], dock = [4.0, 6.0] }

# 角丸半径（pt）。shape = "rounded" のときだけ効く。
radius = 2.0

# shape = "polygon" のとき。目の矩形 w×h に対する 0..1 の閉多角形。
# **右目を書けば、左目は鏡像で自動生成される。**
# polygon = [[0.00, 0.00], [0.00, 0.62], [1.00, 1.00], [0.94, 0.38]]


# ── 状態ごとの目（ぜんぶ省略してよい）──────────────────────────────────────
#
# **この雛形は [eyes.states.*] を 1 つも書いていない。**
# 省略すると 6 状態すべてに既定ルールが適用される:
#
#   working    基準 + 瞬き
#   wait_user  正円に見開く + 白 + 滲み
#   wait_agent 横目（右へ 1.5pt）
#   idle       高さ 2pt の横線 + 暗い色
#   done       基準
#   error      赤い目
#
# つまり**シルエットだけ描けば顔として成立する**。
# 上書きが要るのは「既定だと自分の顔では成立しない」ときだけ
# （例えばスリット目は 0.4 倍まで絞ると bar で消えるので、idle だけ緩める）。
#
# 書くとその状態は**丸ごと置き換わる**（既定とのマージではない）:
#
# [eyes.states.idle]
# h_scale = 0.55                # 基準の高さへの倍率
# w_scale = 1.0                 # 基準の幅への倍率
# dx      = 0.0                 # 中心からの水平ずらし（pt）。横目に使う
# color   = "eye_closed"        # "eye" | "eye_closed" | "eye_error" | "white"
# glow    = 0.0                 # 白い滲み（pt）
# blink   = false               # 瞬きアニメ


# ── 状態ごとの色（ぜんぶ省略してよい）──────────────────────────────────────
#
# **この雛形は [colors.*] を 1 つも書いていない。** 省略すると 6 状態すべてが
# 既定パレット（シアン＝作業中、琥珀＝判断待ち、紫＝エージェント待ち、
# 灰＝アイドル、緑＝完了、赤＝エラー）で描かれる。
#
# 書いた状態・書いた色だけが上書きされる（[eyes.states.*] と違い、丸ごとの
# 置き換えではない。形にも一切触らない）。
#
# accent は生き物の外側ぜんぶ（枠・グロー・状態記号・バッジ・名前・ホバーカードの
# 縁）に効く。**6 状態が互いに見分けられる色を選ぶこと** — 全部同じ色にすると、
# 生き物を見ても今どの状態なのか分からなくなる。
#
# [colors.working]
# accent = "#7f3ac2"            # 枠・グロー・記号・バッジ・名前・カードの縁
# fill   = "#241038"            # 体の面の塗り
# eye    = "#00ff88"            # 目（[eyes.states.*].color より優先）
#
# [colors.error]
# accent = "#ff0044"            # 1 色だけ書いてもよい（面と目は既定のまま）


# ── 顔のパネル線（任意）────────────────────────────────────────────────────
#
# 開いた折れ線の集まり。座標は体の矩形に対する 0..1 比率（左下原点・y は上向き）。
# 書かなければ線画なし（この雛形と egg / round / squircle / bean は持たない）。
#
# **bar は狭いので線を間引くこと**（18x20pt に 7 本引くと潰れて塊になる）。
# sizes を省略すると bar と dock の両方に描かれる。
#
# [[details]]
# name   = "brow"
# sizes  = ["bar", "dock"]
# points = [[0.190, 0.725], [0.500, 0.775], [0.810, 0.725]]
#
# [[details]]
# name   = "forehead"
# sizes  = ["dock"]              # dock でだけ描く
# points = [[0.425, 0.780], [0.425, 0.945], [0.575, 0.945], [0.575, 0.780]]
