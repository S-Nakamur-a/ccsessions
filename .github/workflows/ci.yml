# 品質ゲート。**中身は `make check` そのもの**にしてある。
# ここに fmt / clippy / test を書き下すと、手元のゲートと CI のゲートが 2 か所に
# 分かれて片方だけ腐る（「手元では通ったのに CI で落ちる」の主要因）。
#
# runner は macOS だけ。`ccsessionsd` は AppKit / CoreAnimation を直に叩き、
# `ccsessions-core/src/process.rs` のゾンビ判定も macOS 固有（`proc_pidinfo`）なので、
# Linux で回しても守れる不変条件が無い（[`docs/adr/0021-distribution.md`](../../docs/adr/0021-distribution.md)）。
#
# GUI は要らない。テストは FFI を含まない層（`theme` / `layout` / `geometry`）に
# 閉じてあり、`ccsessions/tests/cli.rs` は状態ディレクトリも `$HOME` も tempdir へ
# 差し替えてから実プロセスを起こす。headless runner で完結する。
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 既定の書き込み権限を落とす。この workflow は読むだけで、リリースも
# コメント投稿もしない。
permissions:
  contents: read

# 同じ PR に続けて push したら古い実行は捨てる（macOS runner は枠が細い）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: make check (stable)
    # 版は固定する。macOS の版が動くと AppKit の挙動も動くので、上げるのは
    # 「上げた」と分かる形でやりたい。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Cargo.lock はコミットしてある（bin crate なので再現性のため）。
      # 手元で依存を足して lock を入れ忘れた PR をここで落とす。
      # `--locked` は lock が古ければエラーになり、ビルドはしない＝速い。
      - name: Cargo.lock が最新か
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: fmt --check + clippy -D warnings + test
        run: make check

  msrv:
    name: MSRV (1.89)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      # Cargo.toml の `rust-version` と同じ版を名指しする。**両方動かすこと**。
      # ここが宣言より新しいと、宣言した下限が誰にも検証されないまま腐る。
      - uses: dtolnay/rust-toolchain@1.89.0

      - uses: Swatinem/rust-cache@v2

      # 下限では「コンパイルが通ること」だけを見る。lint は版によって増減するので
      # clippy を MSRV で回すと、コードの問題ではない失敗が出る。
      - name: cargo check
        run: cargo check --all-targets --locked

  # formula が壊れていることに**ユーザが `brew install` して初めて気づく**のを避ける。
  # ここで見るのはレビュー時に落とせるもの（構文・スタイル・tap とのずれ）だけで、
  # 「実際にビルドとインストールが通るか」はリリース時に `release.yml` が見る
  # （毎 PR で cargo build をまるごと回すのは高すぎる）。
  formula:
    name: formula（style + audit + tap とのずれ）
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    env:
      FORMULA: packaging/homebrew/ccsessions.rb
      TAP_RAW: https://raw.githubusercontent.com/S-Nakamur-a/homebrew-tap/main/Formula/ccsessions.rb
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v5

      # ruby の構文・スタイル崩れを**リリース当日ではなくレビュー時**に落とす。
      # `--online` は付けない（前回リリースの URL を毎 PR で叩く必要は無い）。
      #
      # **パス指定では呼べない。** `brew audit <path>` は Homebrew 側で無効化されて
      # いる（"Calling `brew audit [path ...]` is disabled!"）し、`brew style <path>`
      # はパスだと formula ではなくただの ruby として見るので、Sorbet sigil や
      # frozen_string_literal といった formula には無関係な指摘を出す。
      # **使い捨ての tap に置いて名前で呼ぶ**のが唯一の通し方。
      - name: brew style + audit
        run: |
          set -euo pipefail
          brew tap-new --no-git local/ci
          cp "$FORMULA" "$(brew --repository local/ci)/Formula/ccsessions.rb"
          brew style local/ci/ccsessions
          brew audit --strict --formula local/ci/ccsessions

      # 「原本と tap の 2 か所に同じ formula があるので、片方だけ直すとずれる」を
      # 機械が握る。比較から外すものが 2 つある。
      #
      # - **`url` / `sha256`** — tap 側が正で、`release.yml` がリリースのたびに書く。
      # - **コメント** — 写しの側にだけ「これはレビュー用の写しで手で直さない」と
      #   書く必要があり、そこは意図的にずれる（tap にとってその説明は嘘になる）。
      #
      # 残るのは formula の実体（依存・install・service・caveats・test）で、
      # ここがずれたら brew の挙動が変わる。
      - name: 写しと tap がずれていないか
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 "$TAP_RAW" -o /tmp/tap-ccsessions.rb
          strip() { grep -vE '^[[:space:]]*#|^  (url|sha256) "' "$1"; }
          if ! diff -u <(strip /tmp/tap-ccsessions.rb) <(strip "$FORMULA"); then
            echo "::error::tap の formula と $FORMULA がずれている（上の diff。左が tap、右が写し）"
            exit 1
          fi
          echo "写しと tap は一致している（url / sha256 とコメントを除く）"
